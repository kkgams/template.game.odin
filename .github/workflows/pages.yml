name: Build and deploy web game

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish; newer queued pushes replace older queued runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Set up Odin
        env:
          ODIN_VERSION: dev-2026-09
        run: |
          mkdir -p "$RUNNER_TEMP/odin"
          curl --fail --location --retry 3 "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz" -o "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - name: Set up WASM linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes lld
          wasm-ld --version
      - name: Build web game
        run: make web
      - name: Upload static game
        if: github.ref == 'refs/heads/release'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build.nosync/web

  deploy:
    if: github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
